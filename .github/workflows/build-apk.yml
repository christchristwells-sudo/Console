name: Build Wells Pad AAB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extraire le site
        run: |
          set -e
          test -f wells-pad-netlify.zip
          rm -rf www
          mkdir www
          unzip -o wells-pad-netlify.zip -d www
          test -f www/index.html
          ls -la www

      - name: Installer Capacitor
        run: |
          set -e
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Wells Pad" "com.wells.pad" --web-dir www

      - name: Créer le projet Android
        run: |
          set -e
          npx cap add android
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
            cp www/icon-192.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp www/icon-192.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
          done
          npx cap sync android

      - name: Compiler le fichier AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Publier le fichier AAB
        uses: actions/upload-artifact@v4
        with:
          name: wells-pad-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
